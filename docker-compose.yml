# docker-compose.yml
# ============================================================
# SentinelGraph - Agentic Fraud Detection System
# Infrastructure Services
# ============================================================
# Usage:
#   docker compose up -d          → start all services
#   docker compose down           → stop (keeps data volumes)
#   docker compose down -v        → stop + wipe all data
#   docker compose logs -f neo4j  → tail neo4j logs
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # Neo4j — Fraud Ring Graph Database
  # Browser UI : http://localhost:7474  (user: neo4j / fraud_graph_2024)
  # Bolt URI   : bolt://localhost:7687
  # ──────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: fraud_detection_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (used by Python driver)
    environment:
      NEO4J_AUTH: neo4j/fraud_graph_2024
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — User Identity / Profile Store (cold features)
  # DSN: postgresql://fraud_user:fraud_pass_2024@localhost:5434/fraud_detection
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fraud_detection_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"   # host 5434 → container 5432 (avoids clashing with local PG)
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────
  # Redis — Online Feature Store + Blacklists + Velocity Windows
  # URI: redis://localhost:6379
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fraud_detection_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────────────────
  # Redis Commander — Redis Web UI
  # UI: http://localhost:8081
  # ──────────────────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: fraud_detection_redis_commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

# ──────────────────────────────────────────────────────────
# Named volumes — data persists across container restarts
# ──────────────────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  postgres_data:
