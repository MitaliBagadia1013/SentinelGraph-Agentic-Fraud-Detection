[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short test summary for all failures/errors
addopts =
    -v
    --tb=short
    --no-header
    -q

# Markers
markers =
    unit: Pure unit tests — no external dependencies
    integration: Integration tests — may need pipeline components
    slow: Tests that take >1 second
